<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Torn City Banker</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel2: #1d2230;
      --text: #e8eaf0;
      --muted: #9aa3b2;
      --accent: #5865f2;
      --good: #2ecc71;
      --bad: #e74c3c;
      --warn: #f1c40f;
      --border: #2a3040;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    nav {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    main { padding: 20px; }
    button, input, select, textarea {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      outline: none;
    }
    button { cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); }
    button.danger { background: var(--bad); border-color: var(--bad); }
    button.good { background: var(--good); border-color: var(--good); color: #08130b; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .grid { display: grid; gap: 12px; }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; }
    .muted { color: var(--muted); }
    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--border);
    }
    .good { color: var(--good); }
    .bad { color: var(--bad); }
    .warn { color: var(--warn); }
    pre {
      background: #0b0d11;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      overflow: auto;
      max-height: 360px;
      font-size: 12px;
    }
    details {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: var(--panel2);
      margin-bottom: 10px;
    }
    summary { cursor: pointer; font-weight: 600; }
    .tiny { font-size: 12px; }
    .right { margin-left: auto; }
    .status { padding: 8px 10px; border-radius: 8px; margin-top: 10px; display: none; }
    .status.ok { display: block; background: rgba(46,204,113,.12); border: 1px solid var(--good); }
    .status.err { display: block; background: rgba(231,76,60,.12); border: 1px solid var(--bad); }
    .settingRow {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 10px;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    @media (max-width: 900px) {
      .grid.cols-2, .grid.cols-3 { grid-template-columns: 1fr; }
      .settingRow { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="siteName" style="margin:0;">Torn City Banker</h1>
      <div id="siteTagline" class="muted">Automated verification. Human banker payouts.</div>
    </div>
    <div id="authArea"></div>
  </header>

  <nav id="nav"></nav>
  <main id="main"></main>

  <script>
    const API_BASE = "https://unboundddestiny--1cf34a4c90c111f182311607ee4eb77e.web.val.run";

    let token = localStorage.getItem("tc_token") || "";
    let state = {
      me: null,
      config: {},
      view: "home"
    };

    const ORDER_TYPES = [
      "loss_sell",
      "loss_buy",
      "win_sell",
      "win_buy",
      "bounty_place",
      "merc_post",
      "merc_attack",
      "revive_request"
    ];

    const FEATURE_LABELS = {
      loss_sell: "Loss Selling",
      loss_buy: "Loss Buying",
      win_sell: "Win Selling",
      win_buy: "Win Buying",
      bounty_place: "Bounty Placing",
      merc_post: "Mercenary Posting",
      merc_attack: "Mercenary Attack",
      revive_request: "Revive Request"
    };

    function esc(v) {
      return String(v ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function cfg(key, fallback = null) {
      return state.config?.[key] ?? fallback;
    }

    function money(n) {
      return Number(n || 0).toLocaleString("en-US");
    }

    function fmtTime(ts) {
      if (!ts) return "-";
      return new Date(ts).toLocaleString();
    }

    function setStatus(id, msg, ok = true) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = msg;
      el.className = `status ${ok ? "ok" : "err"}`;
    }

    async function api(path, opts = {}) {
      const headers = {
        "content-type": "application/json",
        ...(token ? { authorization: `Bearer ${token}` } : {}),
        ...(opts.headers || {})
      };

      const res = await fetch(API_BASE + path, {
        ...opts,
        headers
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    function saveToken(t) {
      token = t || "";
      if (token) localStorage.setItem("tc_token", token);
      else localStorage.removeItem("tc_token");
    }

    function setView(view) {
      state.view = view;
      render();
    }

    function renderAuth() {
      const el = document.getElementById("authArea");
      if (!state.me) {
        el.innerHTML = `<button class="primary" onclick="setView('home')">Login / Register</button>`;
        return;
      }

      el.innerHTML = `
        <div class="row">
          <span class="pill">${esc(state.me.user.torn_name)} [${esc(state.me.user.torn_id)}]</span>
          ${state.me.isAdmin ? `<span class="pill warn">Admin</span>` : ""}
          ${state.me.isSettingsAdmin ? `<span class="pill warn">Settings Admin</span>` : ""}
          ${state.me.isBanker ? `<span class="pill good">Banker</span>` : ""}
          <button onclick="logout()">Logout</button>
        </div>
      `;
    }

    function renderNav() {
      const items = [
        ["home", "Home"],
        ["roster", "Roster"],
        ["orders", "Orders"],
        ["jobs", "Jobs"]
      ];

      if (state.me?.isBanker || state.me?.isAdmin) items.push(["admin", "Admin"]);
      if (state.me?.isSettingsAdmin) items.push(["settings", "Settings"]);

      document.getElementById("nav").innerHTML = items
        .map(([key, label]) => `<button class="${state.view === key ? "primary" : ""}" onclick="setView('${key}')">${label}</button>`)
        .join("");
    }

    async function boot() {
      try {
        state.config = await api("/api/config/public");
      } catch {}

      document.getElementById("siteName").textContent = cfg("SITE_NAME", "Torn City Banker");
      document.getElementById("siteTagline").textContent = cfg("SITE_TAGLINE", "");

      if (token) {
        try {
          state.me = await api("/api/me");
        } catch {
          saveToken("");
          state.me = null;
        }
      }

      render();
    }

    function render() {
      renderAuth();
      renderNav();
      const main = document.getElementById("main");

      if (state.view === "home") return viewHome(main);
      if (state.view === "roster") return viewRoster(main);
      if (state.view === "orders") return viewOrders(main);
      if (state.view === "jobs") return viewJobs(main);
      if (state.view === "admin") return viewAdmin(main);
      if (state.view === "settings") return viewSettings(main);
    }

    async function logout() {
      try {
        await api("/api/auth/logout", { method: "POST" });
      } catch {}
      saveToken("");
      state.me = null;
      setView("home");
    }

    function viewHome(main) {
      if (!state.me) {
        main.innerHTML = `
          <div class="panel" style="max-width:700px;">
            <h2>Login / Register</h2>
            <p class="muted">
              Use a <b>Limited access</b> Torn API key. Website sessions persist after login.
              Discord users can instead use <code>/register</code> in Discord.
            </p>
            <div class="grid">
              <input id="apiKeyInput" type="password" placeholder="Limited access Torn API key" />
              <button class="primary" onclick="login()">Register / Login</button>
              <div id="loginStatus" class="status"></div>
            </div>
          </div>
          <div class="panel">
            <h3>Public features</h3>
            <div class="row">
              <button onclick="setView('orders')">Open Orders</button>
              <button onclick="setView('roster')">Roster</button>
              <button onclick="setView('jobs')">Jobs</button>
            </div>
          </div>
        `;
        return;
      }

      main.innerHTML = `
        <div class="grid cols-3">
          <div class="panel">
            <h3>Account</h3>
            <div><b>Name:</b> ${esc(state.me.user.torn_name)}</div>
            <div><b>Torn ID:</b> ${esc(state.me.user.torn_id)}</div>
            <div><b>Level:</b> ${esc(state.me.user.level)}</div>
            <div><b>Faction:</b> ${esc(state.me.user.faction_name || "-")}</div>
            <div><b>API access:</b> ${esc(state.me.user.api_access || "-")}</div>
            <div><b>Last sync:</b> ${fmtTime(state.me.user.last_sync)}</div>
            <div style="margin-top:10px;">
              <button onclick="syncNow()">Sync now</button>
            </div>
            <div id="syncStatus" class="status"></div>
          </div>
          <div class="panel">
            <h3>Quick actions</h3>
            <div class="grid">
              <button onclick="setView('orders')">Create order</button>
              <button onclick="setView('jobs')">Jobs board</button>
              ${state.me.isAdmin ? `<button onclick="setView('roster')">Admin roster inspect</button>` : ""}
              ${state.me.isSettingsAdmin ? `<button onclick="setView('settings')">Settings dashboard</button>` : ""}
            </div>
          </div>
          <div class="panel">
            <h3>Cash message rules</h3>
            <p class="tiny muted">When sending or receiving cash, use the exact reference shown on your order.</p>
            <div>Banker payout: <code>TC PAY {orderId} {reference}</code></div>
            <div>User deposit: <code>TC DEPOSIT {orderId} {reference}</code></div>
          </div>
        </div>
      `;
    }

    async function login() {
      const apiKey = document.getElementById("apiKeyInput").value.trim();
      if (!apiKey) return setStatus("loginStatus", "API key required.", false);

      try {
        const res = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ apiKey })
        });
        saveToken(res.token);
        state.me = await api("/api/me");
        setView("home");
      } catch (e) {
        setStatus("loginStatus", e.message, false);
      }
    }

    async function syncNow() {
      try {
        await api("/api/sync", { method: "POST" });
        setStatus("syncStatus", "Sync completed.", true);
        state.me = await api("/api/me");
        render();
      } catch (e) {
        setStatus("syncStatus", e.message, false);
      }
    }

    async function viewRoster(main) {
      main.innerHTML = `<div class="panel"><h2>Roster</h2><div class="muted">Loading...</div></div><div id="inspectPanel"></div>`;
      try {
        const data = await api("/api/roster");
        const canInspect = data.canInspect && state.me?.isAdmin;

        main.innerHTML = `
          <div class="panel">
            <h2>Roster</h2>
            <table>
              <thead>
                <tr>
                  <th>Name</th><th>ID</th><th>Level</th><th>Faction</th><th>Discord</th><th>Last sync</th>${canInspect ? "<th></th>" : ""}
                </tr>
              </thead>
              <tbody>
                ${data.users.map(u => `
                  <tr>
                    <td>${esc(u.torn_name)}</td>
                    <td>${esc(u.torn_id)}</td>
                    <td>${esc(u.level)}</td>
                    <td>${esc(u.faction_name || "-")}</td>
                    <td>${state.me ? esc(u.discord_username || "-") : "-"}</td>
                    <td>${fmtTime(u.last_sync)}</td>
                    ${canInspect ? `<td><button onclick="inspectUser('${esc(u.torn_id)}')">Inspect</button></td>` : ""}
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
          <div id="inspectPanel"></div>
        `;
      } catch (e) {
        main.innerHTML = `<div class="panel bad">${esc(e.message)}</div>`;
      }
    }

    async function inspectUser(tornId) {
      const panel = document.getElementById("inspectPanel");
      panel.innerHTML = `<div class="panel">Loading inspection...</div>`;
      try {
        const d = await api(`/api/admin/inspect/${tornId}`);
        panel.innerHTML = `
          <div class="panel">
            <h2>Inspect: ${esc(d.user.torn_name)} [${esc(d.user.torn_id)}]</h2>

            <details open>
              <summary>User profile</summary>
              <pre>${esc(JSON.stringify(d.user, null, 2))}</pre>
            </details>

            <details>
              <summary>Limited-key API snapshots (latest per selection)</summary>
              <pre>${esc(JSON.stringify(d.latestSnapshots, null, 2))}</pre>
            </details>

            <details>
              <summary>All parsed Torn log entries</summary>
              <pre>${esc(JSON.stringify(d.tornLogs, null, 2))}</pre>
            </details>

            <details>
              <summary>Cash ledger</summary>
              <pre>${esc(JSON.stringify(d.cashLedger, null, 2))}</pre>
            </details>

            <details>
              <summary>Orders</summary>
              <pre>${esc(JSON.stringify(d.orders, null, 2))}</pre>
            </details>

            <details>
              <summary>Payouts</summary>
              <pre>${esc(JSON.stringify(d.payouts, null, 2))}</pre>
            </details>

            <details>
              <summary>App logs</summary>
              <pre>${esc(JSON.stringify(d.appLogs, null, 2))}</pre>
            </details>

            <details>
              <summary>Audit trail</summary>
              <pre>${esc(JSON.stringify(d.audits, null, 2))}</pre>
            </details>
          </div>
        `;
      } catch (e) {
        panel.innerHTML = `<div class="panel bad">${esc(e.message)}</div>`;
      }
    }

    function calcFees(type, pay, anon) {
      const anonFeePercent = Number(cfg(`FEATURE_${type}_ANON_FEE_PERCENT`, 0));
      const anonFeeFixed = Number(cfg(`FEATURE_${type}_ANON_FEE_FIXED`, 0));
      const feePercent = Number(cfg(`FEATURE_${type}_FEE_PERCENT`, 0));
      const feeFixed = Number(cfg(`FEATURE_${type}_FEE_FIXED`, 0));

      const baseFee = Math.round(pay * (feePercent / 100) + feeFixed);
      const anonFee = anon ? Math.round(pay * (anonFeePercent / 100) + anonFeeFixed) : 0;
      const total = pay + anonFee;
      const payToUser = Math.max(0, pay - baseFee);

      return { baseFee, anonFee, total, payToUser };
    }

    async function viewOrders(main) {
      main.innerHTML = `
        <div class="grid cols-2">
          <div class="panel">
            <h2>Create order</h2>
            ${state.me ? orderFormHtml() : `<p class="muted">Login or register to create orders.</p>`}
            <div id="orderStatus" class="status"></div>
          </div>
          <div class="panel">
            <h2>Public orders</h2>
            <div class="row">
              <select id="orderFilter">
                <option value="">All order types</option>
                ${ORDER_TYPES.map(t => `<option value="${t}">${FEATURE_LABELS[t]}</option>`).join("")}
              </select>
              <button onclick="loadOrders()">Refresh</button>
            </div>
            <div id="orderList" style="margin-top:12px;"></div>
          </div>
        </div>
      `;

      bindOrderForm();
      loadOrders();
    }

    function orderFormHtml() {
      return `
        <div class="grid">
          <label>Type</label>
          <select id="orderType">
            ${ORDER_TYPES.map(t => `<option value="${t}">${FEATURE_LABELS[t]}</option>`).join("")}
          </select>

          <label id="targetLabel">Target / title</label>
          <input id="orderTarget" placeholder="Target, title, or note" />

          <label id="amountLabel">Amount</label>
          <input id="orderAmount" type="number" value="1" />

          <label>Pay amount</label>
          <input id="orderPay" type="number" value="1000000" />

          <label class="row"><input id="orderAnon" type="checkbox" style="width:auto;" /> Anonymous (higher price)</label>
          <div id="feePreview" class="muted tiny"></div>

          <label>Notes</label>
          <textarea id="orderNotes" rows="3" placeholder="Optional notes"></textarea>

          <button class="primary" onclick="submitOrder()">Submit order</button>
        </div>
      `;
    }

    function bindOrderForm() {
      const typeSel = document.getElementById("orderType");
      const anon = document.getElementById("orderAnon");
      const pay = document.getElementById("orderPay");
      if (!typeSel) return;

      function refresh() {
        const type = typeSel.value;
        const targetRequired = cfg(`FEATURE_${type}_TARGET_REQUIRED`, false);
        const amountEl = document.getElementById("orderAmount");
        const targetEl = document.getElementById("orderTarget");

        document.getElementById("targetLabel").textContent =
          type === "merc_post" ? "Title" : targetRequired ? "Target (required)" : "Target / title";

        if (type === "revive_request" || type === "merc_post") {
          amountEl.value = 1;
          amountEl.disabled = true;
        } else {
          amountEl.disabled = false;
        }

        const allowAnon = cfg(`FEATURE_${type}_ALLOW_ANON`, true);
        anon.disabled = !allowAnon;
        if (!allowAnon) anon.checked = false;

        const fees = calcFees(type, Number(pay.value || 0), anon.checked);
        document.getElementById("feePreview").textContent =
          `Total price: ${money(fees.total)} | Anon fee: ${money(fees.anonFee)} | Payout after base fee: ${money(fees.payToUser)}`;
      }

      typeSel.onchange = refresh;
      anon.onchange = refresh;
      pay.oninput = refresh;
      refresh();
    }

    async function submitOrder() {
      try {
        const type = document.getElementById("orderType").value;
        const body = {
          type,
          target: document.getElementById("orderTarget").value.trim(),
          amount: Number(document.getElementById("orderAmount").value || 0),
          pay: Number(document.getElementById("orderPay").value || 0),
          anon: document.getElementById("orderAnon").checked,
          notes: document.getElementById("orderNotes").value.trim()
        };

        const res = await api("/api/orders", {
          method: "POST",
          body: JSON.stringify(body)
        });

        setStatus(
          "orderStatus",
          `Order created: ${res.order.id}. Reference: ${res.order.reference}. Use exact in-game cash message if sending/receiving cash.`,
          true
        );
        loadOrders();
      } catch (e) {
        setStatus("orderStatus", e.message, false);
      }
    }

    async function loadOrders() {
      const list = document.getElementById("orderList");
      const type = document.getElementById("orderFilter")?.value || "";
      list.innerHTML = `<div class="muted">Loading...</div>`;

      try {
        const data = await api(`/api/orders?limit=100${type ? `&type=${encodeURIComponent(type)}` : ""}`);
        if (!data.orders.length) {
          list.innerHTML = `<div class="muted">No public orders.</div>`;
          return;
        }

        list.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>ID</th><th>Type</th><th>Target</th><th>Amount</th><th>Pay</th><th>Total</th><th>Creator</th><th>Status</th><th>Created</th>
              </tr>
            </thead>
            <tbody>
              ${data.orders.map(o => `
                <tr>
                  <td>${esc(o.id)}</td>
                  <td>${esc(FEATURE_LABELS[o.type] || o.type)}</td>
                  <td>${esc(o.target || "-")}</td>
                  <td>${money(o.amount)}</td>
                  <td>${money(o.pay)}</td>
                  <td>${money(o.total_price)}</td>
                  <td>${esc(o.creator)}</td>
                  <td>${esc(o.status)}</td>
                  <td>${fmtTime(o.created_at)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      } catch (e) {
        list.innerHTML = `<div class="bad">${esc(e.message)}</div>`;
      }
    }

    async function viewJobs(main) {
      main.innerHTML = `
        <div class="grid cols-2">
          <div class="panel">
            <h2>Post job</h2>
            ${state.me ? `
              <div class="grid">
                <input id="jobTitle" placeholder="Job title" />
                <input id="jobEmployer" placeholder="Employer / faction" />
                <input id="jobPay" type="number" placeholder="Pay" />
                <input id="jobRequirements" placeholder="Requirements" />
                <input id="jobContact" placeholder="Contact" />
                <button class="primary" onclick="postJob()">Post job</button>
                <div id="jobStatus" class="status"></div>
              </div>
            ` : `<p class="muted">Login to post jobs.</p>`}
          </div>
          <div class="panel">
            <h2>Open jobs</h2>
            <div id="jobList" class="muted">Loading...</div>
          </div>
        </div>
      `;

      loadJobs();
    }

    async function postJob() {
      try {
        const body = {
          title: document.getElementById("jobTitle").value.trim(),
          employer: document.getElementById("jobEmployer").value.trim(),
          pay: Number(document.getElementById("jobPay").value || 0),
          requirements: document.getElementById("jobRequirements").value.trim(),
          contact: document.getElementById("jobContact").value.trim()
        };
        const res = await api("/api/jobs", { method: "POST", body: JSON.stringify(body) });
        setStatus("jobStatus", `Job posted: ${res.id}`, true);
        loadJobs();
      } catch (e) {
        setStatus("jobStatus", e.message, false);
      }
    }

    async function loadJobs() {
      const el = document.getElementById("jobList");
      try {
        const data = await api("/api/jobs");
        if (!data.jobs.length) {
          el.innerHTML = `<div class="muted">No open jobs.</div>`;
          return;
        }

        el.innerHTML = `
          <table>
            <thead><tr><th>Title</th><th>Employer</th><th>Pay</th><th>Requirements</th><th>Contact</th></tr></thead>
            <tbody>
              ${data.jobs.map(j => `
                <tr>
                  <td>${esc(j.title)}</td>
                  <td>${esc(j.employer || "-")}</td>
                  <td>${money(j.pay)}</td>
                  <td>${esc(j.requirements || "-")}</td>
                  <td>${esc(j.contact || "-")}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      } catch (e) {
        el.innerHTML = `<div class="bad">${esc(e.message)}</div>`;
      }
    }

    async function viewAdmin(main) {
      if (!state.me?.isAdmin && !state.me?.isBanker) {
        main.innerHTML = `<div class="panel bad">Staff access required.</div>`;
        return;
      }

      main.innerHTML = `
        <div class="panel">
          <h2>Payout queue</h2>
          <div class="row">
            <button onclick="loadPayouts(true)">All payouts</button>
            <button onclick="loadPayouts(false)">My payouts</button>
          </div>
          <div id="payoutList" style="margin-top:12px;" class="muted">Loading...</div>
        </div>

        <div class="panel">
          <h2>Manual ledger entry</h2>
          <div class="grid cols-3">
            <input id="ledgerTornId" placeholder="Torn ID" />
            <input id="ledgerAmount" type="number" placeholder="Amount" />
            <select id="ledgerDirection">
              <option value="credit">Credit to user</option>
              <option value="debit">Debit from user</option>
            </select>
            <input id="ledgerReason" placeholder="Reason" />
            <input id="ledgerRef" placeholder="In-game cash message / reference" />
            <button class="primary" onclick="addLedger()">Add ledger entry</button>
          </div>
          <div id="ledgerStatus" class="status"></div>
        </div>
      `;

      loadPayouts(true);
    }

    async function loadPayouts(all) {
      const el = document.getElementById("payoutList");
      try {
        const data = await api(`/api/payouts${all ? "?all=1" : ""}`);
        if (!data.payouts.length) {
          el.innerHTML = `<div class="muted">No payouts found.</div>`;
          return;
        }

        el.innerHTML = `
          <table>
            <thead>
              <tr><th>ID</th><th>Order</th><th>User</th><th>Amount</th><th>Status</th><th>Created</th><th>Tx note</th><th></th></tr>
            </thead>
            <tbody>
              ${data.payouts.map(p => `
                <tr>
                  <td>${esc(p.id)}</td>
                  <td>${esc(p.order_id)}</td>
                  <td>${esc(p.torn_id)}</td>
                  <td>${money(p.amount)}</td>
                  <td>${esc(p.status)}</td>
                  <td>${fmtTime(p.created_at)}</td>
                  <td>${esc(p.tx_note || "-")}</td>
                  <td>
                    ${p.status !== "paid" ? `<button class="good" onclick="markPaid('${esc(p.id)}')">Mark paid</button>` : ""}
                  </td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
      } catch (e) {
        el.innerHTML = `<div class="bad">${esc(e.message)}</div>`;
      }
    }

    async function markPaid(payoutId) {
      const txNote = prompt("Enter exact in-game cash message used for payment. Example: TC PAY O-ABCD1234 TC-XYZ98765");
      if (!txNote) return;

      try {
        await api(`/api/payouts/${payoutId}/mark-paid`, {
          method: "POST",
          body: JSON.stringify({ tx_note: txNote })
        });
        loadPayouts(true);
      } catch (e) {
        alert(e.message);
      }
    }

    async function addLedger() {
      try {
        const body = {
          torn_id: document.getElementById("ledgerTornId").value.trim(),
          amount: Number(document.getElementById("ledgerAmount").value || 0),
          direction: document.getElementById("ledgerDirection").value,
          reason: document.getElementById("ledgerReason").value.trim(),
          ref: document.getElementById("ledgerRef").value.trim()
        };
        await api("/api/admin/ledger", { method: "POST", body: JSON.stringify(body) });
        setStatus("ledgerStatus", "Ledger entry added.", true);
      } catch (e) {
        setStatus("ledgerStatus", e.message, false);
      }
    }

    async function viewSettings(main) {
      if (!state.me?.isSettingsAdmin) {
        main.innerHTML = `<div class="panel bad">Settings admin access required.</div>`;
        return;
      }

      main.innerHTML = `
        <div class="panel">
          <h2>Settings dashboard</h2>
          <div class="row">
            <input id="settingsSearch" placeholder="Search settings..." style="min-width:320px;" />
            <button onclick="renderSettings()">Filter</button>
            <button class="primary right" onclick="saveSettings()">Save all</button>
          </div>
          <div id="settingsStatus" class="status"></div>
        </div>
        <div id="settingsList" class="muted">Loading...</div>
      `;

      window.__settings = [];
      try {
        const data = await api("/api/settings");
        window.__settings = data.settings;
        renderSettings();
      } catch (e) {
        document.getElementById("settingsList").innerHTML = `<div class="bad">${esc(e.message)}</div>`;
      }
    }

    function renderSettings() {
      const q = (document.getElementById("settingsSearch")?.value || "").toLowerCase();
      const list = document.getElementById("settingsList");
      const settings = (window.__settings || []).filter(s =>
        !q || s.key.toLowerCase().includes(q) || s.label.toLowerCase().includes(q) || s.category.toLowerCase().includes(q)
      );

      const byCat = {};
      for (const s of settings) {
        byCat[s.category] = byCat[s.category] || [];
        byCat[s.category].push(s);
      }

      list.innerHTML = Object.entries(byCat).map(([cat, items]) => `
        <details>
          <summary>${esc(cat)} (${items.length})</summary>
          ${items.map(s => `
            <div class="settingRow">
              <div>
                <div>${esc(s.label)}</div>
                <div class="tiny muted">${esc(s.key)}</div>
                <div class="tiny muted">${esc(s.description)}</div>
              </div>
              <div>
                ${settingInputHtml(s)}
              </div>
            </div>
          `).join("")}
        </details>
      `).join("");
    }

    function settingInputHtml(s) {
      if (s.type === "boolean") {
        return `<input type="checkbox" data-key="${esc(s.key)}" data-type="boolean" ${s.value ? "checked" : ""} style="width:auto;" />`;
      }
      if (s.type === "number") {
        return `<input type="number" data-key="${esc(s.key)}" data-type="number" value="${esc(s.value)}" style="width:100%;" />`;
      }
      if (s.type === "json") {
        return `<textarea rows="3" data-key="${esc(s.key)}" data-type="json" style="width:100%;">${esc(JSON.stringify(s.value, null, 2))}</textarea>`;
      }
      return `<input type="text" data-key="${esc(s.key)}" data-type="string" value="${esc(s.value)}" style="width:100%;" />`;
    }

    async function saveSettings() {
      const inputs = document.querySelectorAll("[data-key]");
      const updates = {};

      for (const el of inputs) {
        const key = el.dataset.key;
        const type = el.dataset.type;
        let value;

        if (type === "boolean") value = el.checked;
        else if (type === "number") value = Number(el.value || 0);
        else if (type === "json") {
          try {
            value = JSON.parse(el.value || "null");
          } catch {
            throw new Error(`Invalid JSON for ${key}`);
          }
        } else value = el.value;

        updates[key] = value;
      }

      try {
        const res = await api("/api/settings", {
          method: "PUT",
          body: JSON.stringify({ updates })
        });
        setStatus("settingsStatus", `Saved ${res.changed} settings.`, true);
      } catch (e) {
        setStatus("settingsStatus", e.message, false);
      }
    }

    boot();
  </script>
</body>
</html>
