<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torn Log Checker</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; 
            color: #e0e0e0; 
            padding: 20px; 
            max-width: 800px; 
            margin: 0 auto; 
        }
        .card { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            border: 1px solid #333;
        }
        input { 
            padding: 10px; 
            width: 250px; 
            background: #2d2d2d; 
            border: 1px solid #444; 
            color: white; 
            border-radius: 4px; 
            font-size: 14px;
        }
        button { 
            padding: 10px 15px; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 14px;
            margin-left: 5px;
        }
        button:hover { opacity: 0.9; }
        button.logout { background: #f44336; }
        
        .error { color: #f44336; }
        .success { color: #4CAF50; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #4CAF50; font-weight: 600; }
        
        pre { 
            background: #0d0d0d; 
            padding: 15px; 
            border-radius: 4px; 
            overflow-x: auto; 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            font-size: 13px;
            color: #a0a0a0;
            border: 1px solid #333;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>Torn Log Checker</h1>

    <!-- Login Section -->
    <div class="card">
        <p style="margin-top: 0;">Enter your Limited Access API Key (saves to browser session):</p>
        <input type="text" id="apiKeyInput" placeholder="16-character key" maxlength="16">
        <button onclick="submitKey()">Submit</button>
        <button onclick="logout()" id="logoutBtn" class="logout hidden">Logout</button>
        <p id="statusMsg" style="margin-bottom: 0; margin-top: 15px;"></p>
    </div>

    <!-- Auto-displayed Logs for Logged-in User -->
    <div id="myLogsSection" class="card hidden">
        <h2 style="margin-top: 0;">My Recent Logs (Last 24h)</h2>
        <pre id="myLogsContent">Loading logs...</pre>
    </div>

    <!-- Roster Section -->
    <div class="card">
        <h2 style="margin-top: 0;">Registered Players Roster</h2>
        <table id="rosterTable">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Level</th>
                    <th>User ID</th>
                </tr>
            </thead>
            <tbody id="rosterBody">
                <tr><td colspan="3">Loading roster...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // ⚠️ REPLACE THIS WITH YOUR ACTUAL ESM.TOWN DEPLOYMENT URL
        const API_BASE = "https://unboundddestiny--1cf34a4c90c111f182311607ee4eb77e.web.val.run"; 

        window.onload = () => {
            const savedKey = sessionStorage.getItem('torn_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                document.getElementById('logoutBtn').classList.remove('hidden');
                submitKey(true); // Silent auto-login on page load
            } else {
                fetchRoster(); // Still show roster even if not logged in
            }
        };

        async function submitKey(silent = false) {
            const key = document.getElementById('apiKeyInput').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            
            if (!key || key.length !== 16) {
                if (!silent) statusMsg.innerHTML = '<span class="error">Please enter a valid 16-character key.</span>';
                return;
            }

            if (!silent) statusMsg.textContent = 'Verifying key...';

            try {
                const res = await fetch(`${API_BASE}/api/submit-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apiKey: key })
                });
                const data = await res.json();

                if (data.success) {
                    sessionStorage.setItem('torn_api_key', key);
                    document.getElementById('logoutBtn').classList.remove('hidden');
                    if (!silent) {
                        statusMsg.innerHTML = `<span class="success">Successfully registered as <strong>${data.username}</strong> (Level ${data.level})</span>`;
                    }
                    
                    fetchRoster();
                    fetchMyLogs(data.userId); // Automatically fetch and show logs for this player
                } else {
                    if (!silent) statusMsg.innerHTML = `<span class="error">${data.error}</span>`;
                }
            } catch (err) {
                if (!silent) statusMsg.innerHTML = '<span class="error">Network error. Check console.</span>';
                console.error(err);
            }
        }

        async function fetchMyLogs(userId) {
            const logsSection = document.getElementById('myLogsSection');
            const logsContent = document.getElementById('myLogsContent');
            logsSection.classList.remove('hidden');
            logsContent.textContent = 'Fetching logs from Torn API...';

            try {
                const res = await fetch(`${API_BASE}/api/inspect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ targetUserId: userId })
                });
                const data = await res.json();

                if (data.success && data.logs) {
                    if (data.logs.length === 0) {
                        logsContent.textContent = 'No logs found in the last 24 hours.';
                    } else {
                        // Format the sorted log array into clean, readable text
                        const formatted = data.logs.map(log => {
                            const time = new Date(log.timestamp * 1000).toLocaleString();
                            const details = log.log || log.action || log.message || JSON.stringify(log);
                            return `[${time}] ${details}`;
                        }).join('\n\n');
                        logsContent.textContent = formatted;
                    }
                } else {
                    logsContent.innerHTML = `<span class="error">${data.error || 'Failed to load logs.'}</span>`;
                }
            } catch (err) {
                logsContent.innerHTML = '<span class="error">Failed to fetch logs. Check console.</span>';
                console.error(err);
            }
        }

        async function fetchRoster() {
            try {
                const res = await fetch(`${API_BASE}/api/roster`);
                const roster = await res.json();
                const tbody = document.getElementById('rosterBody');
                tbody.innerHTML = '';

                if (!roster || roster.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3">No players registered yet.</td></tr>';
                    return;
                }

                roster.forEach(p => {
                    // Safe fallbacks to prevent "undefined" from ever showing
                    const username = p.username || 'Unknown';
                    const level = p.level ?? 0;
                    const userId = p.userId || 'N/A';
                    
                    const row = `<tr><td>${username}</td><td>${level}</td><td>${userId}</td></tr>`;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error('Failed to fetch roster', err);
                document.getElementById('rosterBody').innerHTML = '<tr><td colspan="3" class="error">Failed to load roster.</td></tr>';
            }
        }

        function logout() {
            sessionStorage.removeItem('torn_api_key');
            document.getElementById('apiKeyInput').value = '';
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('myLogsSection').classList.add('hidden');
            document.getElementById('statusMsg').textContent = 'Logged out successfully.';
            document.getElementById('rosterBody').innerHTML = '<tr><td colspan="3">Loading roster...</td></tr>';
            fetchRoster();
        }
    </script>
</body>
</html>
