<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torn City Registry</title>
  <style>
    :root { --bg: #0f1115; --card: #181b21; --border: #2d3139; --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --success: #3fb950; --danger: #f85149; --gold: #d29922; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; line-height: 1.5; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    .badge { padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: bold; }
    .badge-admin { background: var(--gold); color: #000; }
    .badge-user { background: #333; color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s; font-size: 0.9rem; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-secondary { background: #333; color: #fff; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    input { width: 100%; padding: 0.8rem; border: 1px solid var(--border); border-radius: 6px; background: #000; color: #fff; font-size: 1rem; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .agent-card { background: #22262e; border: 1px solid #333; padding: 1rem; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-between; }
    .agent-name { font-size: 1.2rem; font-weight: bold; color: var(--accent); }
    .agent-id { color: var(--muted); font-family: monospace; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 1rem; }
    th { text-align: left; padding: 0.8rem; background: #000; color: var(--muted); border-bottom: 2px solid var(--border); position: sticky; top: 0; }
    td { padding: 0.8rem; border-bottom: 1px solid var(--border); }
    tr:hover { background: rgba(255,255,255,0.05); }
    .pos { color: var(--success); font-weight: bold; } .neg { color: var(--danger); font-weight: bold; }
    .status { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; background: #333; display: inline-block; }
    .status.hospital { background: var(--danger); color: #fff; }
    .status.jail { background: var(--gold); color: #000; }
    .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
    .tab { padding: 0.8rem 1.5rem; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); }
    .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    .tab-content { display: none; } .tab-content.active { display: block; }
    .hidden { display: none !important; }
    .loader { border: 3px solid #333; border-top: 3px solid var(--accent); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 2rem auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .alert { padding: 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
    .alert-info { background: rgba(88,166,255,0.1); border: 1px solid var(--accent); color: var(--accent); }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🏙️ Torn City Registry</h1>
    <div id="userInfo"></div>
  </div>

  <!-- LOGIN VIEW -->
  <div id="loginView" class="card">
    <h2>🔐 Login / Register</h2>
    <p style="color: var(--muted)">Anyone can log in and register their key. Only authorized inspectors can view logs.</p>
    <input type="password" id="loginKey" placeholder="Paste your Limited API Key...">
    <button class="btn btn-primary" id="loginBtn">Login & Register</button>
    <div id="loginMsg" style="margin-top: 1rem; color: var(--danger);"></div>
  </div>

  <!-- DASHBOARD VIEW -->
  <div id="dashView" class="hidden">
    <div id="permissionAlert" class="alert alert-info hidden"></div>
    <h2>Registered Players</h2>
    <div id="agentGrid" class="grid"></div>
    
    <!-- INSPECTOR MODAL -->
    <div id="inspector" class="card hidden" style="position: fixed; top: 5%; left: 5%; width: 90%; height: 90%; overflow-y: auto; z-index: 100; background: var(--bg); border: 2px solid var(--accent);">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 id="inspTitle">Inspector</h2>
        <button class="btn btn-secondary" onclick="closeInspector()">Close</button>
      </div>
      <div id="inspContent"></div>
    </div>
  </div>
</div>

<script>
const API = "https://unboundddestiny--1cf34a4c90c111f182311607ee4eb77e.web.val.run"; // ⬅️ UPDATE THIS
let sessionKey = localStorage.getItem('torn_admin_key');
let currentUser = null;

const $ = (s) => document.querySelector(s);
const show = (el) => el.classList.remove('hidden');
const hide = (el) => el.classList.add('hidden');

function formatMoney(amount) {
  const n = parseInt(amount);
  const cls = n >= 0 ? 'pos' : 'neg';
  return `<span class="${cls}">$${n.toLocaleString()}</span>`;
}

function formatDate(timestamp) {
  if (!timestamp) return 'N/A';
  return new Date(timestamp * 1000).toLocaleString();
}

function getStatusHtml(status) {
  if (!status) return '<span class="status">Okay</span>';
  const desc = status.description || 'Okay';
  const cls = desc.includes('Hospital') ? 'hospital' : (desc.includes('Jail') ? 'jail' : '');
  return `<span class="status ${cls}">${desc}</span>`;
}

// --- AUTHENTICATION ---
async function checkSession() {
  if (!sessionKey) {
    show($('#loginView'));
    hide($('#dashView'));
    return;
  }
  try {
    const res = await fetch(`${API}/whoami`, { headers: { 'X-Torn-Key': sessionKey } });
    if (res.ok) {
      const data = await res.json();
      if (data.valid) {
        currentUser = data;
        const badge = data.can_inspect 
          ? '<span class="badge badge-admin">INSPECTOR</span>' 
          : '<span class="badge badge-user">MEMBER</span>';
        
        $('#userInfo').innerHTML = `
          <span style="margin-right:1rem">${badge} <strong>${data.name}</strong> [${data.id}]</span>
          <button class="btn btn-secondary" id="logoutBtn">Logout</button>
        `;
        $('#logoutBtn').onclick = () => {
          localStorage.removeItem('torn_admin_key');
          location.reload();
        };
        
        hide($('#loginView'));
        show($('#dashView'));
        
        // Show permission alert for non-inspectors
        if (!data.can_inspect) {
          $('#permissionAlert').textContent = "ℹ️ You are logged in as a member. You can register your key but cannot inspect other players' logs.";
          show($('#permissionAlert'));
        } else {
          hide($('#permissionAlert'));
        }
        
        loadAgents();
        return;
      }
    }
  } catch (e) {}
  localStorage.removeItem('torn_admin_key');
  sessionKey = null;
  checkSession();
}

$('#loginBtn').onclick = async () => {
  const key = $('#loginKey').value.trim();
  $('#loginMsg').innerText = "Verifying...";
  try {
    // First verify the key
    const whoamiRes = await fetch(`${API}/whoami`, { headers: { 'X-Torn-Key': key } });
    const whoamiData = await whoamiRes.json();
    
    if (!whoamiRes.ok || !whoamiData.valid) {
      $('#loginMsg').innerText = `❌ ${whoamiData.error || 'Invalid API Key'}`;
      return;
    }

    // Then register/update the key
    const regRes = await fetch(`${API}/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Torn-Key': key },
      body: JSON.stringify({ api_key: key })
    });
    const regData = await regRes.json();
    
    if (!regRes.ok) {
      $('#loginMsg').innerText = `❌ Registration failed: ${regData.error}`;
      return;
    }

    sessionKey = key;
    localStorage.setItem('torn_admin_key', key);
    checkSession();
  } catch (e) {
    $('#loginMsg').innerText = "❌ Connection Error";
  }
};

// --- DASHBOARD ---
async function loadAgents() {
  const res = await fetch(`${API}/admins`);
  const { admins } = await res.json();
  const grid = $('#agentGrid');
  grid.innerHTML = '';
  
  if (!admins || !admins.length) {
    grid.innerHTML = '<p style="color:var(--muted)">No players registered yet.</p>';
    return;
  }

  admins.forEach(a => {
    const card = document.createElement('div');
    card.className = 'agent-card';
    
    // Only show Inspect button if user has permission
    const inspectBtn = currentUser?.can_inspect
      ? `<button class="btn btn-primary" style="margin-top:1rem" onclick="inspectAgent(${a.torn_id}, '${a.player_name.replace(/'/g, "\\'")}')">Inspect Logs</button>`
      : `<button class="btn btn-secondary" style="margin-top:1rem" disabled title="Inspector access required">Inspect Locked</button>`;
    
    card.innerHTML = `
      <div>
        <div class="agent-name">${a.player_name || 'Unknown'}</div>
        <div class="agent-id">ID: ${a.torn_id}</div>
        <div style="font-size:0.8rem; color:var(--muted)">Registered: ${new Date(a.registered_at).toLocaleDateString()}</div>
      </div>
      ${inspectBtn}
    `;
    grid.appendChild(card);
  });
}

// --- INSPECTOR ---
async function inspectAgent(id, name) {
  if (!currentUser?.can_inspect) return;
  
  show($('#inspector'));
  $('#inspTitle').innerText = `Inspecting: ${name} [${id}]`;
  $('#inspContent').innerHTML = '<div class="loader"></div><p style="text-align:center">Fetching combined dossier...</p>';
  
  try {
    const res = await fetch(`${API}/inspect?torn_id=${id}`, { headers: { 'X-Torn-Key': sessionKey } });
    const json = await res.json();
    
    // ✅ FIX: Safe data extraction to prevent "undefined is not an object"
    if (!res.ok || !json.data) {
      $('#inspContent').innerHTML = `<p style="color:var(--danger)">❌ ${json.error || 'Failed to load data'}</p>`;
      return;
    }
    
    renderDossier(json.data);
  } catch (e) {
    $('#inspContent').innerHTML = `<p style="color:var(--danger)">❌ Network Error: ${e.message}</p>`;
  }
}

function renderDossier(data) {
  // ✅ FIX: Defensive defaults for every field
  const profile = data?.profile || {};
  const attacks = Array.isArray(data?.attacks) ? data.attacks.slice(0, 10) : [];
  const money = Array.isArray(data?.money) ? data.money.slice(0, 10) : [];
  const items = Array.isArray(data?.items) ? data.items.slice(0, 10) : [];

  const html = `
    <div class="card" style="background:#111">
      <h3>${profile.name || 'Unknown'} (Level ${profile.level || '?'})</h3>
      <div style="display:flex; gap:2rem; margin-top:0.5rem; flex-wrap:wrap;">
        <div><strong>Status:</strong> ${getStatusHtml(profile.status)}</div>
        <div><strong>Faction:</strong> ${profile.faction?.position || 'None'}</div>
        <div><strong>Last Action:</strong> ${profile.last_action?.relative || 'N/A'}</div>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab(event, 'tab-attacks')">Attacks (${attacks.length})</div>
      <div class="tab" onclick="switchTab(event, 'tab-money')">Money (${money.length})</div>
      <div class="tab" onclick="switchTab(event, 'tab-items')">Items (${items.length})</div>
    </div>

    <div id="tab-attacks" class="tab-content active">
      ${attacks.length ? `<table>
        <tr><th>Time</th><th>Target</th><th>Result</th><th>Respect</th></tr>
        ${attacks.map(a => `<tr>
          <td>${formatDate(a.timestamp_ended)}</td>
          <td>${a.defender_name || 'Unknown'}</td>
          <td>${a.attacker_name === profile.name ? '⚔️ Attacked' : '🛡️ Defended'} (${a.result || '?'})</td>
          <td>${a.respect_gain ?? 'N/A'}</td>
        </tr>`).join('')}
      </table>` : '<p style="color:var(--muted);padding:1rem">No recent attacks found.</p>'}
    </div>

    <div id="tab-money" class="tab-content">
      ${money.length ? `<table>
        <tr><th>Time</th><th>Description</th><th>Amount</th></tr>
        ${money.map(m => `<tr>
          <td>${formatDate(m.timestamp)}</td>
          <td>${m.description || 'Transaction'}</td>
          <td>${formatMoney(m.amount)}</td>
        </tr>`).join('')}
      </table>` : '<p style="color:var(--muted);padding:1rem">No recent money transactions found.</p>'}
    </div>

    <div id="tab-items" class="tab-content">
      ${items.length ? `<table>
        <tr><th>Time</th><th>Action</th><th>Item</th></tr>
        ${items.map(i => `<tr>
          <td>${formatDate(i.timestamp)}</td>
          <td>${i.action || 'Unknown'}</td>
          <td>${i.item_name || i.id || 'Unknown'}</td>
        </tr>`).join('')}
      </table>` : '<p style="color:var(--muted);padding:1rem">No recent item activity found.</p>'}
    </div>
  `;
  $('#inspContent').innerHTML = html;
}

function switchTab(e, id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById(id).classList.add('active');
}

function closeInspector() { hide($('#inspector')); }

checkSession();
</script>
</body>
</html>
