<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torn API Log Checker</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #121212; 
            color: #e0e0e0; 
            padding: 20px; 
            max-width: 900px; 
            margin: 0 auto; 
        }
        .card { 
            background: #1e1e1e; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            border: 1px solid #333;
        }
        h1, h2 { color: #4CAF50; margin-top: 0; }
        
        input { 
            padding: 10px; 
            width: 250px; 
            background: #2d2d2d; 
            border: 1px solid #444; 
            color: white; 
            border-radius: 4px; 
            font-size: 14px;
            margin-right: 5px;
        }
        button { 
            padding: 10px 15px; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 14px;
        }
        button:hover { opacity: 0.9; }
        button.logout { background: #f44336; margin-left: 5px; }
        button.inspect { background: #2196F3; padding: 5px 10px; font-size: 12px; }
        
        .error { color: #f44336; }
        .success { color: #4CAF50; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { color: #4CAF50; font-weight: 600; }
        
        pre { 
            background: #0d0d0d; 
            padding: 15px; 
            border-radius: 4px; 
            overflow-x: auto; 
            white-space: pre-wrap; 
            word-wrap: break-word; 
            font-size: 13px;
            color: #a0a0a0;
            border: 1px solid #333;
            max-height: 400px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>Torn API Log Checker</h1>

    <!-- Registration Section -->
    <div class="card">
        <h2>Register Player</h2>
        <p style="margin-top: 0; color: #aaa;">Enter your 16-char Limited Access key to join the roster.</p>
        <input type="text" id="regKeyInput" placeholder="Player Limited Key" maxlength="16">
        <button onclick="submitRegistration()">Register</button>
        <button onclick="logout()" id="logoutBtn" class="logout hidden">Logout</button>
        <p id="regStatus" style="margin-bottom: 0; margin-top: 10px;"></p>
    </div>

    <!-- Logs Display Area -->
    <div id="logsSection" class="card hidden">
        <h2 id="logsTitle">Logs</h2>
        <pre id="logsContent">Waiting for selection...</pre>
    </div>

    <!-- Roster Table -->
    <div class="card">
        <h2>Registered Players Roster</h2>
        <table id="rosterTable">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Level</th>
                    <th>User ID</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="rosterBody">
                <tr><td colspan="4">Loading roster...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // ⚠️ REPLACE WITH YOUR ESM.TOWN URL
        const API_BASE = "https://unboundddestiny--1cf34a4c90c111f182311607ee4eb77e.web.val.run"; 

        let currentUser = null;

        window.onload = () => {
            const savedUser = sessionStorage.getItem('torn_current_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                document.getElementById('regKeyInput').value = sessionStorage.getItem('torn_player_key') || '';
                document.getElementById('logoutBtn').classList.remove('hidden');
                fetchRoster();
            }
        };

        async function submitRegistration() {
            const key = document.getElementById('regKeyInput').value.trim();
            const status = document.getElementById('regStatus');
            
            if (!key || key.length !== 16) {
                status.innerHTML = '<span class="error">Invalid key length.</span>';
                return;
            }

            status.textContent = 'Registering...';
            try {
                const res = await fetch(`${API_BASE}/api/submit-key`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ apiKey: key })
                });
                const data = await res.json();

                if (data.success) {
                    currentUser = {
                        userId: data.userId,
                        username: data.username,
                        isAdmin: data.isAdmin
                    };
                    sessionStorage.setItem('torn_current_user', JSON.stringify(currentUser));
                    sessionStorage.setItem('torn_player_key', key);
                    
                    document.getElementById('logoutBtn').classList.remove('hidden');
                    status.innerHTML = `<span class="success">Registered as ${data.username} ${data.isAdmin ? '(Admin)' : ''}</span>`;
                    fetchRoster();
                } else {
                    status.innerHTML = `<span class="error">${data.error}</span>`;
                }
            } catch (err) {
                status.innerHTML = '<span class="error">Network error.</span>';
            }
        }

        async function fetchRoster() {
            try {
                const res = await fetch(`${API_BASE}/api/roster`);
                const roster = await res.json();
                const tbody = document.getElementById('rosterBody');
                tbody.innerHTML = '';

                if (!roster || roster.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">No players registered.</td></tr>';
                    return;
                }

                roster.forEach(p => {
                    const username = p.username || 'Unknown';
                    const level = p.level ?? 0;
                    const userId = p.userId || 'N/A';
                    
                    // Only show inspect button if current user is admin
                    let actionCell = '';
                    if (currentUser && currentUser.isAdmin) {
                        actionCell = `<td><button class="inspect" onclick="inspectPlayer(${userId}, '${username}')">View Logs</button></td>`;
                    } else {
                        actionCell = `<td>-</td>`;
                    }

                    const row = `
                        <tr>
                            <td>${username} ${p.isAdmin ? '👑' : ''}</td>
                            <td>${level}</td>
                            <td>${userId}</td>
                            ${actionCell}
                        </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function inspectPlayer(targetUserId, username) {
            if (!currentUser || !currentUser.isAdmin) {
                alert("You do not have permission to view logs.");
                return;
            }

            const logsSection = document.getElementById('logsSection');
            const logsTitle = document.getElementById('logsTitle');
            const logsContent = document.getElementById('logsContent');
            
            logsSection.classList.remove('hidden');
            logsTitle.textContent = `Logs for ${username} (ID: ${targetUserId})`;
            logsContent.textContent = 'Fetching logs...';

            try {
                const res = await fetch(`${API_BASE}/api/inspect`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        targetUserId: targetUserId,
                        inspectorUserId: currentUser.userId 
                    })
                });
                
                const data = await res.json();

                if (data.success && data.logs) {
                    if (data.logs.length === 0) {
                        logsContent.textContent = "No logs found in last 24 hours.";
                    } else {
                        const formatted = data.logs.map(log => {
                            const time = new Date(log.timestamp * 1000).toLocaleString();
                            const msg = log.log || log.action || JSON.stringify(log);
                            return `[${time}] ${msg}`;
                        }).join('\n\n');
                        logsContent.textContent = formatted;
                    }
                } else {
                    logsContent.innerHTML = `<span class="error">${data.error || 'Failed to load logs.'}</span>`;
                }
            } catch (err) {
                logsContent.innerHTML = '<span class="error">Network error while fetching logs.</span>';
            }
        }

        function logout() {
            sessionStorage.removeItem('torn_current_user');
            sessionStorage.removeItem('torn_player_key');
            currentUser = null;
            document.getElementById('regKeyInput').value = '';
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('regStatus').textContent = '';
            document.getElementById('logsSection').classList.add('hidden');
            fetchRoster();
        }
    </script>
</body>
</html>
